<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" shape-rendering="crispEdges"><title>card_backs_privacy</title><g id="base"><rect x="0" y="0" width="1600" height="1000" fill="#0A1119"/><text x="40" y="30" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#E0BE7C" shape-rendering="auto">卡背与隐私 / 独立可复用资源</text><image href="../../../ui/cards/card_back_hand.png" x="80" y="140" width="202" height="236" style="image-rendering:pixelated"/><text x="80" y="435" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#A4B4CB" shape-rendering="auto">hand</text><image href="../../../ui/cards/card_back_opponent.png" x="380" y="140" width="78" height="82" style="image-rendering:pixelated"/><text x="380" y="435" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#A4B4CB" shape-rendering="auto">opponent</text><image href="../../../ui/cards/card_back_deck.png" x="680" y="140" width="200" height="264" style="image-rendering:pixelated"/><text x="680" y="435" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#A4B4CB" shape-rendering="auto">deck</text><image href="../../../ui/interaction/handoff.png" x="260" y="640" width="1080" height="134" style="image-rendering:pixelated"/><text x="600" y="664" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#E0BE7C" shape-rendering="auto">请将操作交给玩家 2</text><image href="../../../ui/interaction/button_primary_normal.png" x="580" y="712" width="440" height="36" style="image-rendering:pixelated"/><text x="713" y="722" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#E7E5D5" shape-rendering="auto">确认接手 · 显示自己的手牌</text><text x="26