name: build-and-replay
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - name: Verify generated card catalogue
        run: |
          python tools/catalog_source.py --check
          python tools/check_module_dependencies.py
          python tools/generate_card_catalog.py
          git diff --exit-code -- docs/card-catalog.md docs/card-catalog.html
      - name: Configure Windows with failure diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & cmake --preset windows 2>&1
          $configureExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($configureExit -ne 0) {
            $summary = ($output | Select-Object -Last 40 | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=CMake configuration failed::$summary"
          }
          exit $configureExit
      - run: cmake --build --preset windows --parallel 4
      - run: ctest --preset windows
      - run: python tools/network_smoke.py --exe build/windows/Release/wizard_network_probe.exe --output build/network-ci
      - run: build/windows/Release/wizard_cli.exe smoke assets build/windows/cross-platform.json 42
      - run: build/windows/Release/wizard_cli.exe ai-match assets build/windows/ai-replay.json 42 2
      - run: build/windows/Release/wizard_cli.exe tutorial-smoke assets build/windows/tutorial-replay.json
      - run: cmake --install build/windows --config Release --prefix dist/WizardCard
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: dist/WizardCard
      - uses: actions/upload-artifact@v7
        with:
          name: reference-replay
          path: |
            build/windows/cross-platform.json
            build/windows/ai-replay.json
            build/windows/tutorial-replay.json
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - run: python tools/catalog_source.py --check
      - run: python tools/prepare_godot_frontend_assets.py --check
      - run: python tools/check_module_dependencies.py
      - run: cmake -S . -B build/core-only -G Ninja -DWIZARD_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/core-only --parallel 4
      - run: cmake --preset headless
      - run: cmake --build --preset headless --parallel 4
      - run: ctest --preset headless
      - run: python tools/network_smoke.py --exe build/headless/wizard_network_probe --output build/network-ci
      - uses: actions/upload-artifact@v7
        with:
          name: linux-core-cli
          path: build/headless/wizard_cli
  central-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: cmake --preset server-release
      - run: cmake --build --preset server-release --parallel 4
      - run: ctest --preset server-release --parallel 4
      - name: Build and test Debian 13 delivery
        run: |
          docker build --target build -f deploy/Dockerfile -t wizard-central-debian13 .
          docker run --rm --user "$(id -u):$(id -g)" --cpus=2 --memory=4g \
            -v "$PWD:/workspace:ro" -v "$PWD/build:/reports" -w /workspace \
            wizard-central-debian13 python3 tools/central_smoke.py \
            --exe /src/build/server-release/wizard_server --rooms 20 --duration 600 \
            --report /reports/central-capacity-debian13.json
          mkdir -p dist
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace:ro" -v "$PWD/dist:/output" -w /workspace \
            wizard-central-debian13 python3 tools/package_central_server.py \
            --build /src/build/server-release \
            --output /output/WizardCard-CentralServer-2.6.0-hotfix.1-linux-x86_64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: central-server-evidence
          path: |
            build/server-release/Testing/Temporary/
            build/server-release/central-smoke.json
            build/central-capacity-debian13.json
            dist/WizardCard-CentralServer-*.tar.gz*
  godot-bridge:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - name: Verify frontend runtime art
        run: python tools/prepare_godot_frontend_assets.py --check
      - name: Download pinned editor
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile godot-editor.zip
          Expand-Archive -LiteralPath godot-editor.zip -DestinationPath build/godot-editor
      - name: Configure independent native bridge
        shell: pwsh
        run: |
          $editor = (Resolve-Path build/godot-editor/Godot_v4.7.2-stable_win64_console.exe).Path
          cmake -S . -B build/godot-debug -G 'Visual Studio 17 2022' -A x64 -DWIZARD_BUILD_GODOT=ON -DGODOTCPP_TARGET=template_debug "-DGODOT_BIN=$editor"
      - run: cmake --build build/godot-debug --config Release --target wizard_godot_bridge wizard_cli --parallel 4
      - run: ctest --test-dir build/godot-debug -C Release -R godot_ --output-on-failure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: godot-bridge-evidence
          path: |
            build/godot-debug/Testing/Temporary/
            build/godot-debug/godot-replay-report.json
            build/godot-debug/frontend-report.json
            godot/bin/wizard_godot_bridge.debug.dll
  cross-platform-replay:
    runs-on: ubuntu-24.04
    needs: [windows, linux-core]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: reference-replay
          path: build/reference
      - uses: actions/download-artifact@v8
        with:
          name: linux-core-cli
          path: build/headless
      - run: chmod +x build/headless/wizard_cli
      - run: build/headless/wizard_cli replay assets build/reference/cross-platform.json
      - run: build/headless/wizard_cli replay assets build/reference/ai-replay.json
      - run: build/headless/wizard_cli replay assets build/reference/tutorial-replay.json
  linux-godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libgl1-mesa-dri libglx-mesa0 libegl1 \
            libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libxrender1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 \
            libfontconfig1 libasound2t64 libpulse0 libssl-dev xvfb xauth xdotool weston
      - name: Download and verify pinned official Linux toolchain
        run: |
          mkdir -p build/godot-editor .cache/godot-templates
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fsSL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o build/godot-editor/editor.zip
          curl -fsSL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o build/godot-editor/templates.tpz
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  build/godot-editor/editor.zip' | sha512sum -c -
          echo 'ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  build/godot-editor/templates.tpz' | sha512sum -c -
          unzip -q build/godot-editor/editor.zip -d build/godot-editor
          unzip -q build/godot-editor/templates.tpz 'templates/linux_debug.x86_64' 'templates/linux_release.x86_64' 'templates/version.txt' -d .cache/godot-templates
          chmod +x build/godot-editor/Godot_v4.7.2-stable_linux.x86_64 .cache/godot-templates/templates/linux_*.x86_64
          echo "GODOT_BIN=$PWD/build/godot-editor/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Verify source, resources and packaging contracts
        run: |
          python tools/catalog_source.py --check
          python tools/check_module_dependencies.py
          python tools/prepare_godot_frontend_assets.py --check
          python -m unittest tools/test_package_godot.py -v
          bash -n tools/run_godot_frontend.sh
      - name: Build Linux Debug bridge and native tools
        run: |
          cmake --preset linux-godot-debug -DGODOT_BIN="$GODOT_BIN" -DWIZARD_BUILD_SERVER=ON
          cmake --build --preset linux-godot-debug --parallel 4
          readelf -d godot/bin/libwizard_godot_bridge.debug.so
          ldd godot/bin/libwizard_godot_bridge.debug.so
      - name: Run native, boundary, replay and frontend CTest
        run: ctest --preset linux-godot-debug
      - name: Verify native network and CLI recordings
        run: |
          python tools/network_smoke.py --exe build/linux-godot-debug/wizard_network_probe --output build/linux-network
          build/linux-godot-debug/wizard_cli smoke assets/release-v260 build/linux-godot-debug/release-replay.json 42
          build/linux-godot-debug/wizard_cli replay assets/release-v260 build/linux-godot-debug/release-replay.json
      - name: Build Release and verify extracted portable archive
        run: |
          cmake --preset linux-godot-release -DGODOT_BIN="$GODOT_BIN"
          cmake --build --preset linux-godot-release --parallel 4
          python tools/package_godot.py --platform linux --godot "$GODOT_BIN" --build build/linux-godot-release
          mkdir -p build/linux-extracted
          tar -xzf dist/WizardCard-2.6.0-hotfix.1-linux-x86_64.tar.gz -C build/linux-extracted
      - name: Verify rendered X11 and real keyboard input
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' python tools/linux_desktop_smoke.py \
            --godot "$GODOT_BIN" --driver x11 --output build/linux-x11
          package_dir="$PWD/build/linux-extracted/WizardCard-2.6.0-hotfix.1-linux-x86_64"
          log="$PWD/build/linux-x11/extracted-startup.log"
          data="$PWD/build/linux-x11/extracted-data"
          cd "$RUNNER_TEMP"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$package_dir/run.sh" \
            --display-driver x11 --audio-driver Dummy --quit-after 8 --log-file "$log" -- --user-data "$data"
          ! grep -E 'ERROR:|SCRIPT ERROR|handle_crash:' "$log"
          test -f "$data/settings.json"
      - name: Verify rendered native Wayland under Weston
        run: |
          mkdir -p build/weston-runtime build/linux-wayland
          chmod 700 build/weston-runtime
          export XDG_RUNTIME_DIR="$PWD/build/weston-runtime" WAYLAND_DISPLAY=wizardcard-wayland
          weston --backend=headless --renderer=pixman --width=1920 --height=1080 \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 --no-config --log="$PWD/build/linux-wayland/weston.log" &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          python tools/linux_desktop_smoke.py --godot "$GODOT_BIN" --driver wayland --output build/linux-wayland
          package_dir="$PWD/build/linux-extracted/WizardCard-2.6.0-hotfix.1-linux-x86_64"
          log="$PWD/build/linux-wayland/extracted-startup.log"
          data="$PWD/build/linux-wayland/extracted-data"
          cd "$RUNNER_TEMP"
          "$package_dir/run.sh" --display-driver wayland --audio-driver Dummy \
            --quit-after 8 --log-file "$log" -- --user-data "$data"
          ! grep -E 'ERROR:|SCRIPT ERROR|handle_crash:' "$log"
          test -f "$data/settings.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-godot-evidence
          path: |
            build/linux-godot-debug/Testing/Temporary/
            build/linux-godot-release/Testing/Temporary/
            build/linux-godot-debug/godot-replay-report.json
            build/linux-godot-debug/frontend-report.json
            build/linux-network/
            build/linux-x11/
            build/linux-wayland/
            dist/WizardCard-2.6.0-hotfix.1-linux-x86_64/package-checks/
            dist/WizardCard-2.6.0-hotfix.1-linux-x86_64-archive-checks/
      - uses: actions/upload-artifact@v7
        with:
          name: WizardCard-2.6.0-hotfix.1-linux-x86_64
          path: |
            dist/WizardCard-2.6.0-hotfix.1-linux-x86_64.tar.gz
            dist/WizardCard-2.6.0-hotfix.1-linux-x86_64.tar.gz.sha256
            dist/WizardCard-2.6.0-hotfix.1-linux-x86_64/RELEASE.json
            dist/WizardCard-2.6.0-hotfix.1-linux-x86_64/SHA256.json
