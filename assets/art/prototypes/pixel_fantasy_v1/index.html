/assets/items/barbs.png" target="_blank"><img src="source/WizardCard_PixelFantasy_64x64_20261004/assets/items/barbs.png" alt="银光锐语" loading="lazy"></a><figcaption><h2>银光锐语</h2><span>1448 × 1086 · PNG</span><p>银色锐利咒文干扰准备连接，目标法术球仍完整。取消准备语义仍需真人辨识确认。</p></figcaption></figure><figure class=""><a href="source/WizardCard_PixelFantasy_64x64_20261004/assets/items/ring.png" target="_blank"><img src="source/WizardCard_PixelFantasy_64x64_20261004/assets/items/ring.png" alt="奥术圆环" loading="lazy"></a><figcaption><h2>奥术圆环</h2><span>1448 × 1086 · PNG</span><p>单枚竖立开口圆环与顺向循环能量；未画固定宿主，保持阵法和法术附着通用。</p></figcaption></figure></section></main></html>
