<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" shape-rendering="crispEdges"><title>counter-spell</title><g id="base"></g><g id="art_backing"><rect x="130" y="290" width="765" height="490" fill="#F5E4BF"/></g><g id="existing_card_illustration"><image href="../../../alpha-v1/counter-spell.png" x="213" y="308" width="593" height="445" style="image-rendering:pixelated"/></g><g id="original_master"><image href="../../../ui/a-gilded-v2/painted/word.png" x="0" y="0" width="1024" height="1536" style="image-rendering:pixelated"/></g><g id="dynamic_title"><text x="316" y="119" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="48" fill="#FFF1CD" shape-rendering="auto">法术反制</text><text x="320" y="237" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">塑能 · 仅响应</text><text x="126" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">施法费用</text><text x="299" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">4</text><text x="396" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">环阶</text><text x="569" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">3</text><text x="666" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">速度</text><text x="839" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">4</text><text x="150" y="1058" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">对手释放法术时，可以无效并销毁该法术。自</text><text x="150" y="1109" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">身获得等于其实际施法费用的临时荷载，在下</text><text x="150" y="1160" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">一个自己的结束阶段清除。四速后不可响应。</text><text x="150" y="1380" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#FFF1CD" shape-rendering="auto">言灵</text><text x="644" y="1387" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" fill="#FFF1CD" shape-rendering="auto">传说</text><image href="../../../ui/a-gilded-v2/painted/gem_legendary.png" x="761" y="1338" width="128" height="128" style="image-rendering:pixelated"/><image href="../../../ui/a-gilded-v2/cards/rarity_legendary.png" x="763" y="1464" width="126" height="36" style="image-rendering:pixelated"/></g></svg>