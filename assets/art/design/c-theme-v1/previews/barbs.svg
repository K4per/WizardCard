<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" shape-rendering="crispEdges"><title>barbs</title><g id="base"><image href="../../../ui/c-theme-v1/cards/frame_word_full.png" x="0" y="0" width="360" height="560" style="image-rendering:pixelated"/></g><g id="existing_illustration"><image href="../../../cards/barbs.png" x="52" y="85" width="256" height="192" style="image-rendering:pixelated"/><text x="50" y="24" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#FAEFD2" shape-rendering="auto">银光锐语</text><text x="24" y="60" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="12" fill="#392C29" shape-rendering="auto">惑控 · 仅响应</text><text x="24" y="296" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="11" fill="#392C29" shape-rendering="auto">施法费用</text><text x="101" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#392C29" shape-rendering="auto">5</text><text x="132" y="296" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="11" fill="#392C29" shape-rendering="auto">环阶</text><text x="209" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#392C29" shape-rendering="auto">1</text><text x="240" y="296" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="11" fill="#392C29" shape-rendering="auto">速度</text><text x="317" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#392C29" shape-rendering="auto">2</text><text x="26" y="373" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#392C29" shape-rendering="auto">当对方宣告一张解析法术准备施法时，可</text><text x="26" y="398" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#392C29" shape-rendering="auto">以响应并取消那次准备施法。那之后，可</text><text x="26" y="423" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#392C29" shape-rendering="auto">以将自己场上一张解析完成的解析法术准</text><text x="26" y="448" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#392C29" shape-rendering="auto">备施法。</text><text x="24" y="520" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#FAEFD2" shape-rendering="auto">言灵</text><text x="224" y="522" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#FAEFD2" shape-rendering="auto">史诗</text><image href="../../../ui/c-theme-v1/rarity/rarity_badge_epic.png" x="279" y="508" width="64" height="40" style="image-rendering:pixelated"/></g></svg>