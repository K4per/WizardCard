<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" shape-rendering="crispEdges"><title>protective-flame</title><g id="base"></g><g id="art_backing"><rect x="130" y="290" width="765" height="490" fill="#F5E4BF"/></g><g id="existing_card_illustration"><image href="../../../alpha-v1/protective-flame.png" x="213" y="308" width="593" height="445" style="image-rendering:pixelated"/></g><g id="original_master"><image href="../../../ui/a-gilded-v2/painted/word.png" x="0" y="0" width="1024" height="1536" style="image-rendering:pixelated"/></g><g id="dynamic_title"><text x="316" y="119" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="48" fill="#FFF1CD" shape-rendering="auto">避火咒</text><text x="320" y="237" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">防护 · 专注</text><text x="126" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">施法费用</text><text x="299" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">2</text><text x="396" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">环阶</text><text x="569" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">1</text><text x="666" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">速度</text><text x="839" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">2</text><text x="150" y="1058" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">专注。自身获得火焰伤害抗性，伤害减半并向</text><text x="150" y="1109" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">下取整；抗性不叠加，销毁本法术后失去此抗</text><text x="150" y="1160" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">性。</text><text x="150" y="1380" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#FFF1CD" shape-rendering="auto">言灵</text><text x="644" y="1387" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" fill="#FFF1CD" shape-rendering="auto">普通</text><image href="../../../ui/a-gilded-v2/painted/gem_common.png" x="761" y="1338" width="128" height="128" style="image-rendering:pixelated"/><image href="../../../ui/a-gilded-v2/cards/rarity_common.png" x="763" y="1464" width="126" height="36" style="image-rendering:pixelated"/></g></svg>