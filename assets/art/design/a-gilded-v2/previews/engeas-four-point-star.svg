<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" shape-rendering="crispEdges"><title>engeas-four-point-star</title><g id="base"></g><g id="art_backing"><rect x="130" y="290" width="765" height="490" fill="#F5E4BF"/></g><g id="existing_card_illustration"><image href="../../../alpha-v1/engeas-four-point-star.png" x="213" y="308" width="593" height="445" style="image-rendering:pixelated"/></g><g id="original_master"><image href="../../../ui/a-gilded-v2/painted/formation.png" x="0" y="0" width="1024" height="1536" style="image-rendering:pixelated"/></g><g id="dynamic_title"><text x="316" y="119" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="48" fill="#FFF1CD" shape-rendering="auto">恩格亚斯四角星</text><text x="320" y="237" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">WizardCard</text><text x="126" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">体量</text><text x="299" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">1</text><text x="396" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">负载上限</text><text x="569" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">2</text><text x="666" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">魔力产出</text><text x="839" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">4</text><text x="126" y="931" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">环位</text><text x="299" y="928" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">1</text><text x="396" y="931" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">最高环阶</text><text x="569" y="928" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">3</text><text x="150" y="1058" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">每个自己的回合一次：在本阵法上开始解析的</text><text x="150" y="1109" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">第一张位阶不超过1、需要解析时间的法术，</text><text x="150" y="1160" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">立即完成解析。</text><text x="150" y="1380" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#FFF1CD" shape-rendering="auto">阵法</text><text x="644" y="1387" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" fill="#FFF1CD" shape-rendering="auto">史诗</text><image href="../../../ui/a-gilded-v2/painted/gem_epic.png" x="761" y="1338" width="128" height="128" style="image-rendering:pixelated"/><image href="../../../ui/a-gilded-v2/cards/rarity_epic.png" x="763" y="1464" width="126" height="36" style="image-rendering:pixelated"/></g></