name: build-and-replay
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - name: Verify generated card catalogue
        run: |
          python tools/generate_card_catalog.py
          git diff --exit-code -- docs/card-catalog.md docs/card-catalog.html
      - name: Configure Windows with failure diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & cmake --preset windows 2>&1
          $configureExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($configureExit -ne 0) {
            $summary = ($output | Select-Object -Last 40 | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=CMake configuration failed::$summary"
          }
          exit $configureExit
      - run: cmake --build --preset windows --parallel 4
      - run: ctest --preset windows
      - run: build/windows/Release/wizard_cli.exe smoke assets build/windows/cross-platform.json 42
      - run: build/windows/Release/wizard_cli.exe ai-match assets build/windows/ai-replay.json 42 2
      - run: build/windows/Release/wizard_cli.exe tutorial-smoke assets build/windows/tutorial-replay.json
      - run: cmake --install build/windows --config Release --prefix dist/WizardCard
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/WizardCard
      - uses: actions/upload-artifact@v4
        with:
          name: reference-replay
          path: |
            build/windows/cross-platform.json
            build/windows/ai-replay.json
            build/windows/tutorial-replay.json
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - run: cmake --preset headless
      - run: cmake --build --preset headless --parallel 4
      - run: ctest --preset headless
      - uses: actions/upload-artifact@v4
        with:
          name: linux-core-cli
          path: build/headless/wizard_cli
  cross-platform-replay:
    runs-on: ubuntu-latest
    needs: [windows, linux-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reference-replay
          path: build/reference
      - uses: actions/download-artifact@v4
        with:
          name: linux-core-cli
          path: build/headless
      - run: chmod +x build/headless/wizard_cli
      - run: build/headless/wizard_cli replay assets build/reference/cross-platform.json
      - run: build/headless/wizard_cli replay assets build/reference/ai-replay.json
      - run: build/headless/wizard_cli replay assets build/reference/tutorial-replay.json
