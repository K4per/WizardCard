services:
  wizard-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: wizardcard-central-server:2.6.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "24443:24443/tcp"
    volumes:
      - wizard_data:/var/lib/wizard-server
    secrets:
      - server_cert
      - server_key
    environment:
      WIZARD_CERT: /run/secrets/server_cert
      WIZARD_KEY: /run/secrets/server_key
      WIZARD_DATA_DIR: /var/lib/wizard-server
      WIZARD_BIND: 0.0.0.0
      WIZARD_PORT: "24443"
      WIZARD_HEALTH_PORT: "24444"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:24444/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
    cpus: 2.0
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local

volumes:
  wizard_data:

secrets:
  server_cert:
    file: ./certs/server.crt
  server_key:
    file: ./certs/server.key
