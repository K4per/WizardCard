:16.5%;width:77%;height:35.5%}.detail-card .meta{top:54%}.detail-card .gem{top:55%;height:7%}.detail-card .serial{display:block;font-size:14px;max-width:24%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.detail-card .summary{font-size:14px}.detail-body{line-height:1.75;max-height:24vh;overflow:auto}.menu{display:grid;place-items:center;min-height:70vh}.menu-box{display:flex;align-items:center;flex-direction:column;gap:12px}.logo{width:min(680px,80vw);height:210px;object-fit:contain;margin-bottom:12px}.menu-box .btn{min-width:250px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:12px;text-align:left;border-bottom:1px solid #493324}.battle{display:grid;grid-template-columns:230px minmax(480px,1fr) 230px;gap:14px;height:calc(100vh - 168px);min-height:520px}.battle>aside{overflow:auto}.battle-center{display:grid;grid-template-rows:1fr 38px 1fr 88px;gap:7px;min-height:0}.half{background:#101f2dee;border:2px solid #715033;padding:6px;display:grid;grid-template-columns:55px minmax(0,1fr) 55px;gap:5px;min-height:0}.side-piles{display:flex;flex-direction:column;justify-content:end;gap:5px}.pile{background:#172f3d;border:1px solid #9e7040;text-align:center;padding:5px;font-size:14px}.pile img{width:24px;height:30px;object-fit:contain}.field{display:grid;grid-template-rows:28px 25px repeat(5,minmax(22px,1fr));gap:3px;min-height:0}.stats{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:14px;justify-content:space-between}.stats img{width:18px;height:18px;vertical-align:middle}.casting{border:1px solid #715033;background:#172f3d;display:flex;gap:8px;align-items:center;padding:2px 6px;font-size:14px}.host-row{display:grid;grid-template-columns:76px 1fr;gap:3px;min-height:0}.host-anchor{background:#214957;border:1px solid #9e7040;display:flex;align-items:center;gap:4px;font-size:14px;padding:2px;white-space:nowrap}.host-anchor img{width:19px;height:19px}.analysis-row{background:#101f2d;border:1px solid #493324;display:flex;gap: <div class="review-bar"><h1>C 版 · 资产与页面装配预览</h1><select id="page"></select><select id="state"></select><button id="assetBtn">资源目录</button><input id="search" placeholder="筛选资源 ID" hidden><a href="manifests/c-pixel-v1/ASSET_LIST.md">逐文件清单</a><a href="manifests/c-pixel-v1/coverage.md">需求核对</a></div><div class="review-note">静态设计预览；样例数据与状态用于评审，不执行规则、联网或保存。文字为浏览器实时排版，现有插画按原 ID 引用。</div><main class="screen" id="screen"></main>
<script>
const DATA=__DATA__, A=Object.fromEntries(DATA.assets.map(a=>[a.id,a]));
const labels={menu:'01 标题与主菜单',local:'02 本地配置与初始阵法',ai:'03 AI配置',decks:'04 卡组列表',builder:'05 卡组编辑器',network:'06 联机与房间',battle:'07 对战与决策',tutorial:'08 教学',settings:'09 设置与局内菜单',result:'10 换手与终局',reconnect:'11 联机异常',dialog:'12 确认与故障'};
const states={menu:['default','focus'],local:['valid','no-initial','invalid-deck','waiting'],ai:['easy','normal','hard','no-initial','invalid-deck'],decks:['valid','draft','invalid','empty','save-error'],builder:['valid','migration-error','long-name','save-error'],network:['entry','connecting','failed','lobby','ready','waiting-initial'],battle:['complex','empty','priority','speed4','recipe','recipe-cancel','quota-used','facedown-zero','flip-cost','talisman-wait','cannot-cast','overload','danger','exhaustion','temp-life','temp-expire','drag-legal','drag-invalid','drag-return','region-browser','long-chain'],tutorial:['40-10','initial','recipe','facedown','talisman-wait','speed-chain','overload','exhaustion','temp-life'],settings:['settings','local-pause','online-menu','reduced'],result:['handoff','victory','defeat','draw','save-pending','save-error'],reconnect:['lost','reconnecting','restored','timeout','host-left','waiting'],dialog:['delete','concede','exit','unsaved','save-error','corrupt','incompatible','resource-error']};
const stateNames={'default':'默认','focus':'键盘焦点','valid':'正常','no-initial':'无合法初始阵法','invalid-deck':'牌表非法','waiting':'等待','easy':'简单','normal':'普通','hard':'困难','draft':'草稿','invalid':'无效卡组','empty':'空状态','save-error':'保存失败','migration-error':'旧牌表迁移错误','long-name':'长名称','entry':'创建 / 加入','connecting':'连接中','failed':'连接失败','lobby':'房间','ready':'已准备','waiting-initial':'等待初始阵法','complex':'复杂对局','priority':'优先权','speed4':'4速不可响应','recipe':'配方材料确认','recipe-cancel':'配方取消','quota-used':'本回合额度已用','facedown-zero':'盖伏零支付','flip-cost':'反转费用','talisman-wait':'咒符等待','cannot-cast':'不可发动','overload':'过载伤害','danger':'结束阶段败北危险','exhaustion':'奥术枯竭','temp-life':'临时生命','temp-expire':'临时生命到期','drag-legal':'合法落点','drag-invalid':'无效落点','drag-return':'取消返回','region-browser':'区域浏览','long-chain':'长连锁','40-10':'40 / 10 构筑','initial':'初始阵法','facedown':'盖伏与反转','speed-chain':'速度与连锁','settings':'设置','local-pause':'本地暂停','online-menu':'联机菜单','reduced':'精简演出','handoff':'接手遮挡','victory':'胜利','defeat':'失败','draw':'平局','save-pending':'保存中','lost':'断线','reconnecting':'重连中','restored':'已恢复','timeout':'超时','host-left':'房主离开','delete':'删除确认','concede':'投降确认','exit':'退出确认','unsaved':'未保存修改','corrupt':'文件损坏','incompatible':'版本不兼容','resource-error':'资源错误'};
const url=id=>A[id]?.file||'';const image=(id,cls='',alt='')=>`<img class="${cls}" src="${url(id)}" alt="${alt}">`;
const panel=(title,body,cls='')=>`<section class="panel ${cls}"><h2>${title}</h2>${body}</section>`;
const button=(t,disabled=false,role='primary')=>`<button class="btn ${role}" ${disabled?'disabled':''}>${t}</button>`;
const badge=(id,t)=>`<span class="badge">${image(id)}${t}</span>`;
const status=(text,type='')=>`<div class="status ${type}">${text}</div>`;
const escape=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function card(c,view='hand',big=false){const type=c.designType||'analysis',f=big?`c2d.card.detail.${type}.ai`:`c2d.card.${view}.${type}`;return `<div class="card ${big?'detail-card':''}" data-card="${escape(c.id)}">${image(f,'frame')}<img class="art" src="${c.art}" alt="${escape(c.name)}"><span class="name">${escape(c.name)}</span><span class="cost">${c.cost??1}</span><span class="meta">${{analysis:'解析',talisman:'咒符',incantation:'言灵',formation:'阵法',rune:'符文'}[type]} · 速${c.speed||1}</span>${image('c2d.rarity.'+(c.rarity||'common'),'gem')}<span class="summary">${big?'效果与条件见下方详情':(type==='formation'?'配方 / 等级':'位阶 '+(c.rank||1))}</span><span class="bottom-value">${c.rank||1}</span><span class="serial">${escape(c.id).slice(0,12)}</span></div>`}
const back=()=>`<div class="card back">${image('c2d.card.back.compact')}</div>`;
const cards=DATA.cards, fire=cards.find(c=>c.id==='fireball'),formation=cards.find(c=>c.id==='balance');
function detail(c=fire){return panel('卡牌详情',card(c,'detail',true)+`<hr class="separator"><div class="row">${badge('c2d.icon.type.'+c.designType,{analysis:'解析法术',talisman:'咒符法术',incantation:'言灵法术',formation:'阵法',rune:'符文'}[c.designType])}${badge('c2d.rarity.'+(c.rarity||'common'),'稀有度独立标记')}</div><div class="detail-body"><p>${escape(c.text)}</p><p>速度 ${c.speed||1} · ${c.designType==='formation'?'阵法等级':'法术位阶'} ${c.rank||1}</p>${c.designType==='formation'?'<p>配方条件列表<br>◇ 魔素条件<br>◇ 材料卡条件<br>本回合设置 / 替换额度共享</p>':'<p>目标、当前费用与合法窗口在执行确认中显示。</p>'}</div>`)}
function list(arr){return `<div class="list">${arr.map((c,i)=>`<div class="list-item"><span>${escape(c.name)}</span><span>×${c.count||2}</span></div>`).join('')}</div>`}
function menu(){return `<div class="menu"><div class="menu-box">${image('c2d.brand.logo','logo','WizardCard')}${['本地对局','AI对局','真人联机','卡组构筑','设置','退出'].map(t=>button(t,false,t==='本地对局'?'primary':'secondary')).join('')}</div></div>`}
function config(page,state){const bad=['no-initial','invalid-deck'].includes(state);const names=['魔导工坊','奥术学派'];return `<h1 class="page-title">${page==='ai'?'AI 对局':'本地对局配置'}</h1><div class="cols">${panel('我方卡组',`<label class="field">牌组<select class="input"><option>奥术学派</option><option>自建牌组</option></select></label><div class="row">${badge('c2d.icon.zone.main-deck','主卡组 40 / 40')}${badge('c2d.icon.zone.side-deck','阵法副卡组 10 / 10')}</div><hr class="separator"><h2>初始阵法 · 等级 1</h2><div class="card-group">${card(formation)}${bad?status(state==='no-initial'?'没有可选的 1 级初始阵法':'牌表不合法，请修复后继续','error'):button('选择此阵法')}</div>`)}${panel(page==='ai'?'对手与难度':'对方配置',page==='ai'?`<label class="field">对手预设<select class="input"><option>${names[0]}</option></select></label><div class="row">${['简单','普通','困难'].map(t=>button(t)).join('')}</div><p>打法摘要：优先维护阵法与荷载。</p>${button('查看教学',false,'secondary')}`:`<label class="field">对方牌组<select class="input"><option>${names[1]}</option></select></label><p>主卡组 40 / 40 · 副卡组 10 / 10</p><p>选择 1 级初始阵法</p>`)} </div><div class="controls-row"><label>种子 <input class="input" value="20261009"></label>${button('开始对局',bad||state==='waiting')}${button('返回',false,'secondary')}</div>${state==='waiting'?status('等待对方确认初始阵法'):''}`}
function decks(state){return `<h1 class="page-title">我的卡组</h1><div class="row">${button('新建卡组')}${button('复制预设',false,'secondary')}</div><br>${panel('牌组列表',state==='empty'?status('暂无自建卡组。新建或复制预设后开始构筑。'):`<table class="table"><tr><th>名称</th><th>主 / 副</th><th>状态</th><th>操作</th></tr>${['奥术学派','秘仪手稿','未完成牌组'].map((n,i)=>`<tr><td>${n}</td><td>${i===2?'32 / 6':'40 / 10'}</td><td>${i===2?'草稿':state==='invalid'&&i===1?'无效 ID':'合法'}</td><td>${button('编辑',false,'secondary')}${button('改名',false,'secondary')}${button('删除',false,'danger')}</td></tr>`).join('')}</table>`)}${state==='save-error'?status('保存失败，当前编辑已保留。可重试或返回。','error'):''}`}
function builder(state){const non=cards.filter(c=>c.designType!=='formation'),forms=cards.filter(c=>c.designType==='formation');return `<h1 class="page-title">卡组构筑 · ${state==='long-name'?'这个牌组的名字很长用于检查中文排版':'奥术学派'}</h1>${state==='migration-error'?status('主卡组中有阵法或失效 ID。移动阵法到副卡组，移除失效条目。','error'):''}${state==='save-error'?status('保存失败：当前牌组编辑仍保留。','error'):''}<div class="three">${detail(formation)}<div class="column">${panel('主卡组 40 / 40',list(non.slice(0,20)))}${panel('阵法副卡组 10 / 10',list(forms.slice(0,5)))}</div>${panel('卡池',`<div class="row">${['解析','咒符','言灵','阵法','符文'].map(t=>button(t,false,'secondary')).join('')}</div><br><input class="input" placeholder="名称、等级或配方筛选"><p class="small muted">阵法进入副卡组，其余类型进入主卡组。</p><div class="pool">${cards.slice(0,16).map(c=>card(c)).join('')}</div><div class="controls-row">${button('上一页',false,'secondary')}${button('下一页',false,'secondary')}${button('保存卡组')}${button('返回',false,'secondary')}</div>`)}</div>`}
function network(state){if(['entry','connecting','failed'].includes(state))return `<h1 class="page-title">真人联机</h1><div class="cols">${panel('创建房间',`<label class="field">端口<input class="input" value="7777"></label>${button('创建房间',state==='connecting')}`)}${panel('加入房间',`<label class="field">IP 地址<input class="input" value="127.0.0.1"></label><label class="field">端口<input class="input" value="7777"></label>${button('加入房间',state==='connecting')}`)}</div><br>${state==='connecting'?status('连接中…') : state==='failed'?status('连接失败，请检查地址与端口。可重试。','error'):''}`;return `<h1 class="page-title">房间 · 魔导工坊</h1><div class="cols">${panel('我方',`<p>主卡组 40 / 40 · 副卡组 10 / 10</p><p>牌表校验通过</p>${card(formation)}${button(state==='ready'?'取消准备':'准备')}`)}${panel('对方',`<p>已连接</p><p>${state==='waiting-initial'?'正在选择初始阵法':'等待准备'}</p><div class="status">仅显示公开状态；不显示对方私有牌表。</div>`)}</div><div class="controls-row">${button('开始对局',state!=='ready')}${button('离开房间',false,'secondary')}</div>`}
function hud(opponent,state){const load=state==='danger'?'16 / 8':state==='overload'?'10 / 8':'6 / 8';return `<div class="stats"><span>${opponent?'对方':'我方'}</span><span>${image('c2d.icon.hud.life')} 20</span><span>${image('c2d.icon.hud.temp-life')} ${state==='temp-life'?'3 · 1回合':'0'}</span><span>${image('c2d.icon.hud.mana')} 5</span><span>${image('c2d.icon.hud.load')} ${load}</span></div>`}
function half(opponent,state){const empty=state==='empty';return `<section class="half"><div class="side-piles"><div class="pile">${image('c2d.icon.zone.side-deck')}<br>副卡组</div><div class="pile">${image('c2d.card.back.compact')}<br>主 ${state==='exhaustion'&&!opponent?'0':'26'}</div></div><div class="field">${hud(opponent,state)}<div class="casting">施法区 ${empty?'':`${image('c2d.icon.type.incantation','label-icon')}<span>发动 / 持续</span>`}</div>${Array.from({length:5},(_,i)=>`<div class="host-row"><div class="host-anchor">${image('c2d.icon.type.formation')}阵${i+1}</div><div class="analysis-row">${empty?'':i<3?`<span class="mini-card"><img src="${cards[i].art}" alt="">${opponent?'公开牌':cards[i].name}</span><span class="mini-card facedown">${image('c2d.card.back.compact')}盖伏</span>`:''}</div></div>`).join('')}</div><div class="side-piles"><div class="pile">${image('c2d.icon.zone.ash')}<br>灰烬 4</div></div></section>`}
function battle(state){const noResponse=state==='speed4',long=state==='long-chain',recipe=['recipe','recipe-cancel','quota-used'].includes(state);const messages={'facedown-zero':'盖伏：本次魔素 0，新增荷载 0。','flip-cost':'反转：本次魔素 2，新增荷载 1。','talisman-wait':'当回合盖伏的咒符需要等待，当前不可发动。','cannot-cast':'当前无合法发动操作；仍可查看卡牌。','overload':'过载伤害来源：新增荷载。','danger':'危险：荷载达到上限 2 倍，结束阶段检查败北。','exhaustion':'奥术枯竭：失败抽取累计 2，下一次伤害 3。','temp-life':'临时生命 3，仅存在 1 回合。','temp-expire':'临时生命到期移除，不是受到伤害。','drag-legal':'✓ 合法落点；确认前不支付。','drag-invalid':'× 无效落点；取消后返回。','drag-return':'拖动已取消，卡牌返回原位。','quota-used':'本回合设置 / 替换额度已使用。','recipe-cancel':'材料选择已取消，没有完成设置。','priority':'当前优先权：我方，可发动合法响应。'};return `<div class="battle"><aside class="column">${detail()}${state==='region-browser'?panel('区域浏览',list(cards.slice(0,6))):''}</aside><div class="battle-center">${half(true,state)}<div class="phase"><span>抽牌</span><span>准备</span><span>主要</span><span class="active">施法</span><span>结束</span><span>我方优先权</span></div>${half(false,state)}<div class="hand">${cards.filter(c=>c.designType!=='formation').slice(0,6).map(c=>card(c)).join('')}</div></div><aside class="column">${panel('连锁与响应',`<div class="small">构建 C1 → C2 → C3<br>结算 C3 → C2 → C1</div><div class="scroll">${Array.from({length:long?9:3},(_,i)=>`<div class="chain-item"><strong>C${(long?9:3)-i}</strong>${image('c2d.icon.speed.'+(i===0&&noResponse?4:(i%3)+1))}<span>${i===0&&noResponse?'4速 · 不可响应':'待结算链节'}</span></div>`).join('')}</div>${button('放弃响应',noResponse,'secondary')}`)}${panel(recipe?'阵法配方':'操作确认',`<div class="recipe">${recipe?'✓ 魔素条件达成<br>◇ 选择送灰烬材料<br>设置 / 替换额度 '+(state==='quota-used'?'0 / 1':'1 / 1'):'目标：对方玩家<br>费用：以当前确认摘要为准'}</div>${messages[state]?`<p class="small">${messages[state]}</p>`:''}<div class="row">${button('确认',noResponse||['talisman-wait','cannot-cast','quota-used'].includes(state))}${button('取消',false,'secondary')}</div>`)}${panel('日志',`<div class="log">C3 → C2 → C1<br>公开事件<br>${noResponse?'4速不可响应':''}<br>过载 / 枯竭来源独立<br>结束阶段清理双方施法区</div>`)}</aside></div>`}
function tutorial(state){const texts={'40-10':'主卡组 40 张；阵法副卡组 10 张。阵法不进入主卡组。','initial':'开局从副卡组选择 1 级初始阵法。','recipe':'设置 / 替换按条件列表选择材料；每回合共享一次额度。','facedown':'盖伏不支付魔素、不产生荷载，反转时再展示本次费用。','talisman-wait':'当回合盖伏的咒符不可发动。盖伏解析法术不推进解析。','speed-chain':'速度 1–4；4速不可响应。连锁逆序结算。','overload':'新增荷载可能造成伤害；2倍危险在结束阶段检查。','exhaustion':'空牌库失败抽取造成 1、2、3…递增伤害。','temp-life':'临时生命有独立层与到期提示。'};return `<h1 class="page-title">教学 · ${stateNames[state]}</h1><div class="cols">${panel('操作目标',`<p>${texts[state]}</p><div class="row">${button('上一步',false,'secondary')}${button('下一步')}${button('退出教学',false,'secondary')}</div>`)}${panel('关键标识',`<div class="row">${badge('c2d.icon.decision.zero-cost','盖伏零支付')}${badge('c2d.icon.decision.wait-turn','等待下回合')}${badge('c2d.icon.chain.no-response','4速不可响应')}</div><br><div class="card-group">${card(fire)}${back()}</div>`)}</div>`}
function settings(state){if(state==='local-pause'||state==='online-menu')return panel(state==='local-pause'?'对局已暂停':'局内菜单',`<div class="column center-dialog">${['继续','保存复盘','设置','投降','离开'].map(t=>button(t,false,t==='投降'?'danger':'secondary')).join('')}</div>${state==='online-menu'?status('联机对局继续运行；此菜单不会暂停对方。'):''}`);return `<h1 class="page-title">设置</h1><div class="cols">${panel('声音与显示',`<label class="field">总音量<input type="range" value="70"></label><label class="field">音效音量<input type="range" value="80"></label><label class="field">显示方式<select class="input"><option>窗口</option><option>全屏</option></select></label><label class="field">分辨率<select class="input"><option>1920×1080</option><option>1600×1000</option><option>1280×720</option></select></label>`)}${panel('对局与演出',`<p><label><input type="checkbox"> 自动通过无合法响应时点</label></p><p><label><input type="checkbox" ${state==='reduced'?'checked':''}> 精简演出</label></p><p>精简模式缩短特效，关闭镜头反馈。</p><div class="row">${button('保存设置')}${button('返回',false,'secondary')}</div>`)}</div>`}
function result(state){if(state==='handoff')return `<div class="veil">${panel('请交给下一位玩家',`<p>手牌与私有选择已遮挡。</p>${button('确认接手')}`)}</div>`;const kind=['victory','defeat','draw'].includes(state)?state:'victory';return `<div class="center-dialog">${panel({victory:'胜利',defeat:'失败',draw:'平局'}[kind],`${image('c2d.result.'+kind,'result-mark')}<p>${kind==='defeat'?'败北原因：结束阶段荷载危险检查':'对局已结束'}</p><p>${state==='save-error'?'保存失败，可重试；结果仍保留。':state==='save-pending'?'正在保存…':'复盘保存入口'}</p><div class="row">${button(state==='save-error'?'重试保存':'保存复盘',state==='save-pending')}${button('重新开始',false,'secondary')}${button('返回主菜单',false,'secondary')}</div>`)}</div>`}
function reconnect(state){const msg={lost:'连接中断，对手私有信息已遮挡。',reconnecting:'重连中 · 剩余 30 秒',restored:'连接已恢复，等待对局状态同步。',timeout:'重连超时，请返回房间。','host-left':'房主已离开房间。',waiting:'请求等待中，请勿重复提交。'};return `<div class="veil"><div class="center-dialog">${panel('联机状态',status(msg[state],['timeout','host-left'].includes(state)?'error':'')+`<br>${button(state==='restored'?'继续':'重试连接',state==='waiting'||state==='reconnecting')}${button('返回房间',false,'secondary')}`)}</div></div>`}
function dialog(state){const msg={delete:['删除卡组','删除后无法从列表恢复此牌组。'],concede:['确认投降','结束当前对局。'],exit:['确认退出','离开当前对局并返回主菜单。'],unsaved:['未保存修改','保存当前编辑、放弃修改或返回继续编辑。'],'save-error':['保存失败','当前编辑仍保留，请重试或取消。'],corrupt:['文件损坏','保留当前牌组，可重新选择文件。'],incompatible:['版本不兼容','当前数据无法载入，请选择兼容版本。'],'resource-error':['资源载入失败','卡名和合法信息仍可查看。']};const [title,body]=msg[state];return `<div class="center-dialog">${panel(title,`<p>${body}</p><div class="row">${button(state==='save-error'?'重试':state==='unsaved'?'保存':'确认',false,['delete','concede','exit'].includes(state)?'danger':'primary')}${button('取消',false,'secondary')}${state==='unsaved'?button('放弃修改',false,'danger'):''}</div>`)}</div>`}
function assetsView(){const query=document.querySelector('#search').value.toLowerCase();const arr=DATA.assets.filter(a=>a.id.includes(query));return `<h1 class="page-title">资源目录 · ${arr.length} 项</h1><div class="row">${Object.entries(DATA.palette).map(([n,c])=>`<span class="badge" style="border-color:${c}"><i style="background:${c};width:16px;height:16px"></i>${n}</span>`).join('')}</div><br><div class="asset-grid">${arr.map(a=>`<article class="asset-item"><div class="thumb">${a.frameSize?`<div class="fx-player" style="background-image:url('${a.file}');--duration:${a.frames/a.fps}s;--frames:${a.frames}"></div>`:`<img src="${a.file}" alt="${a.id}">`}</div><a href="${a.file}">${a.id}</a><p class="small">${a.size.join(' × ')} · ${a.origin.startsWith('new')?'SVG / PNG':'AI 原图'}</p>${a.source?`<a href="${a.source}">源稿</a>`:''}</article>`).join('')}</div>`}
const renderers={menu,local:config,ai:config,decks,builder,network,battle,tutorial,settings,result,reconnect,dialog};let mode='pages';
function render(){const page=document.querySelector('#page').value,state=document.querySelector('#state').value;document.body.classList.toggle('reduced',state==='reduced');document.querySelector('#screen').innerHTML=mode==='assets'?assetsView():['local','ai'].includes(page)?config(page,state):renderers[page](state);document.querySelector('#screen').style.backgroundImage=`url('${url('c2d.background.realm')}')`;history.replaceState(null,'',`?page=${page}&state=${state}&mode=${mode}`);document.querySelectorAll('.primary,.secondary,.danger').forEach(el=>{const role=el.classList.contains('danger')?'danger':el.classList.contains('secondary')?'secondary':'primary';for(const st of ['normal','hover','pressed','focus','disabled'])el.style.setProperty('--button-'+st,`url('${url('c2d.button.'+role+'.'+st)}')`)});document.querySelectorAll('.card[data-card]').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.card.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}));window.reviewReady=true;}
const pageSelect=document.querySelector('#page'),stateSelect=document.querySelector('#state');pageSelect.innerHTML=Object.entries(labels).map(([id,name])=>`<option value="${id}">${name}</option>`).join('');const params=new URLSearchParams(location.search);pageSelect.value=params.get('page')||'menu';function updateState(){stateSelect.innerHTML=states[pageSelect.value].map(id=>`<option value="${id}">${stateNames[id]||id}</option>`).join('')};updateState();if(states[pageSelect.value].includes(params.get('state')))stateSelect.value=params.get('state');mode=params.get('mode')||'pages';document.querySelector('#search').hidden=mode!=='assets';pageSelect.onchange=()=>{mode='pages';document.querySelector('#search').hidden=true;updateState();render()};stateSelect.onchange=render;document.querySelector('#assetBtn').onclick=()=>{mode=mode==='assets'?'pages':'assets';document.querySelector('#search').hidden=mode!=='assets';render()};document.querySelector('#search').oninput=render;document.documentElement.style.setProperty('--panel',`url('${url('c2d.panel.surface')}')`);render();window.REVIEW={states,render};
</script></html>
