<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" shape-rendering="crispEdges"><title>shield</title><g id="base"></g><g id="art_backing"><rect x="130" y="290" width="765" height="490" fill="#F5E4BF"/></g><g id="existing_card_illustration"><image href="../../../alpha-release/shield.png" x="213" y="308" width="593" height="445" style="image-rendering:pixelated"/></g><g id="original_master"><image href="../../../ui/a-gilded-v2/painted/word.png" x="0" y="0" width="1024" height="1536" style="image-rendering:pixelated"/></g><g id="dynamic_title"><text x="316" y="119" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="48" fill="#FFF1CD" shape-rendering="auto">护盾术</text><text x="320" y="237" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">防护</text><text x="126" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">施法费用</text><text x="299" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">2</text><text x="396" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">环阶</text><text x="569" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">1</text><text x="666" y="841" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#322324" shape-rendering="auto">速度</text><text x="839" y="838" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#322324" shape-rendering="auto">2</text><text x="150" y="1058" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">获得6点临时生命（取较高值，不叠加）。可</text><text x="150" y="1109" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" fill="#322324" shape-rendering="auto">以单独设置，在合法时点响应或主动释放。</text><text x="150" y="1380" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#FFF1CD" shape-rendering="auto">言灵</text><text x="644" y="1387" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" fill="#FFF1CD" shape-rendering="auto">普通</text><image href="../../../ui/a-gilded-v2/painted/gem_common.png" x="761" y="1338" width="128" height="128" style="image-rendering:pixelated"/><image href="../../../ui/a-gilded-v2/cards/rarity_common.png" x="763" y="1464" width="126" height="36" style="image-rendering:pixelated"/></g></svg>